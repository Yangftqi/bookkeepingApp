name: bookkeeping_app
description: 基米记账 - 本地多用户深度定制支出记账与宏观经济学洞察应用
publish_to: 'none'
version: 1.2.3+6

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  sqflite: ^2.4.1
  sqflite_common_ffi: ^2.3.4
  sqlite3_flutter_libs: ^0.5.24
  path: ^1.9.0
  path_provider: ^2.1.5
  shared_preferences: ^2.3.3
  fl_chart: ^0.69.2
  file_picker: ^8.1.4
  image_picker: ^1.1.2
  crop_your_image: ^1.1.0
  image: ^4.3.0
  archive: ^3.6.1
  share_plus: ^10.1.3
  crypto: ^3.0.6
  http: ^1.2.2
  flutter_markdown: ^0.7.4
  uuid: ^4.5.1
  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#4F46E5"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
  windows:
    generate: true
    image_path: "assets/icon/app_icon.png"
    icon_size: 256
